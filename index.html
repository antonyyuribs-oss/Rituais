<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191B20">
  <meta name="apple-mobile-web-app-title" content="RITUAIS">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="app-version" content="10">
  <meta name="description" content="RITUAIS: estratégias, registro rápido e preparação, com histórico e temas escuros.">
  <link rel="icon" href="./favicon.ico?v=10" sizes="any">
  <link rel="icon" href="./icon-192.png?v=10" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=10" sizes="180x180" type="image/png">
  <link rel="apple-touch-icon-precomposed" href="./apple-touch-icon-precomposed.png?v=10" sizes="180x180">
  <link rel="manifest" href="./manifest.webmanifest?v=10">
  <link rel="stylesheet" href="./styles.css?v=10">
  <title>RITUAIS</title>
  <script src="./app.js?v=10" defer></script>
</head>
<body>
  <div class="app-shell">
    <main id="main" class="main" tabindex="-1"></main>
    <nav class="bottom-nav" id="navigation" aria-label="Navegação principal"></nav>
    </div>
  <div id="theme-backdrop" class="modal-backdrop" hidden></div>
  <section id="theme-modal" class="theme-modal" role="dialog" aria-modal="true" aria-labelledby="theme-modal-title" hidden>
    <div class="theme-modal-card">
      <div class="theme-modal-head">
        <div>
          <p class="eyebrow">Personalização</p>
          <h2 id="theme-modal-title" class="heading">Cores do app</h2>
          <p class="version-note">RITUAIS · versão 10</p>
        </div>
        <button id="theme-close" class="icon-button" type="button" aria-label="Fechar">×</button>
      </div>
      <div id="theme-options" class="theme-options"></div>
    </div>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <input id="history-import-file" type="file" accept=".json,application/json" hidden>
</body>
</html>
