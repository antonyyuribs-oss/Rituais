<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3656">
  <meta name="description" content="RITUAIS: atividades, moods e estratégias pessoais com design premium e personalização de cores.">
  <link rel="icon" href="assets/icone.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="stylesheet" href="styles.css?v=2">
  <title>RITUAIS</title>
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <div class="app-shell">
    <main id="main" class="main" tabindex="-1"></main>
    <nav class="bottom-nav" id="navigation" aria-label="Navegação principal"></nav>
    </div>
  <div id="theme-backdrop" class="modal-backdrop" hidden></div>
  <section id="theme-modal" class="theme-modal" role="dialog" aria-modal="true" aria-labelledby="theme-modal-title" hidden>
    <div class="theme-modal-card">
      <div class="theme-modal-head">
        <div>
          <p class="eyebrow">Personalização</p>
          <h2 id="theme-modal-title" class="heading">Cores do app</h2>
        </div>
        <button id="theme-close" class="icon-button" type="button" aria-label="Fechar">×</button>
      </div>
      <div id="theme-options" class="theme-options"></div>
    </div>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
</body>
</html>
